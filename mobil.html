<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Bobil Booking</title>

<!-- ===== PWA: gjør denne siden installerbar som app på hjemskjermen ===== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b82f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bobil">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --border:#e2e8f0; --line:#f1f5f9;
    --text:#0f172a; --muted:#64748b; --faint:#94a3b8;
    --blue:#3b82f6; --green:#16a34a; --red:#dc2626; --amber:#a16207;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; overscroll-behavior-y:none;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:16px;}

  /* ---------- LOGIN ---------- */
  #login-overlay{
    position:fixed; inset:0; z-index:200; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 24px calc(32px + var(--safe-bottom));
  }
  #login-overlay .logo{font-size:56px; margin-bottom:4px;}
  #login-overlay h1{font-size:22px; margin:0 0 4px;}
  #login-overlay p{color:var(--muted); font-size:14px; margin:0 0 24px; text-align:center;}
  #login-overlay .box{width:100%; max-width:340px;}

  /* ---------- APP SHELL ---------- */
  #app-root{display:none; flex-direction:column; height:100%;}
  #app-root.on{display:flex;}

  header{
    background:var(--card); border-bottom:1px solid var(--border);
    padding:calc(10px + var(--safe-top)) 16px 10px;
    display:flex; align-items:center; justify-content:space-between; flex:0 0 auto;
  }
  header .title{font-size:17px; font-weight:700; line-height:1.2;}
  header .sub{font-size:11px; color:var(--muted); margin-top:1px;}
  header button{
    background:none; border:none; color:var(--red); font-weight:600; font-size:14px; padding:6px;
  }

  main{
    flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:12px 12px calc(20px + var(--safe-bottom));
  }

  /* ---------- BUNNMENY ---------- */
  nav{
    flex:0 0 auto; background:var(--card); border-top:1px solid var(--border);
    display:flex; padding-bottom:var(--safe-bottom);
  }
  nav button{
    flex:1; background:none; border:none; padding:7px 2px 5px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--muted); font-size:10px; font-weight:600; position:relative;
  }
  nav button .ic{font-size:20px; line-height:1;}
  nav button.active{color:var(--blue);}
  nav .badge{
    position:absolute; top:2px; right:calc(50% - 20px);
    background:var(--red); color:#fff; font-size:10px; font-weight:700;
    min-width:17px; height:17px; border-radius:9px; padding:0 4px;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- BYGGEKLOSSER ---------- */
  h2.section{font-size:15px; font-weight:700; margin:2px 0 8px;}
  .panel{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px;}
  .panel h3{font-size:14px; font-weight:700; margin:0 0 8px;}
  .muted{color:var(--muted); font-size:13px;}
  .faint{color:var(--faint); font-size:12px;}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:16px 0;}

  .kpis{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;}
  .kpi{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 11px;}
  .kpi .lbl{font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
  .kpi .val{font-size:20px; font-weight:800; margin-top:2px; white-space:nowrap;}
  .kpi .sub{font-size:11px; color:var(--faint); margin-top:1px;}
  .val.green{color:var(--green);} .val.red{color:var(--red);}

  .bar-row{margin-bottom:9px;}
  .bar-top{display:flex; justify-content:space-between; font-size:12px; font-weight:600; margin-bottom:3px;}
  .bar-track{height:8px; background:var(--line); border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:4px;}

  .row{
    display:flex; align-items:flex-start; gap:10px; padding:10px 0;
    border-top:1px solid var(--line);
  }
  .row:first-child{border-top:none;}
  .row .grow{flex:1; min-width:0;}
  .row .t{font-size:14px; font-weight:700;}
  .row .s{font-size:12px; color:var(--muted); margin-top:2px;}
  .row .chev{color:var(--blue); font-weight:600; font-size:13px; white-space:nowrap; align-self:center;}
  .row.tappable:active{background:var(--line);}

  .pill{
    display:inline-block; padding:3px 8px; border-radius:20px;
    font-size:11px; font-weight:700; white-space:nowrap;
  }
  .p-ok{background:#dcfce7; color:#15803d;}
  .p-warn{background:#fef9c3; color:#a16207;}
  .p-bad{background:#fee2e2; color:#b91c1c;}
  .p-off{background:#e2e8f0; color:#64748b;}
  .pills{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}

  .chips{display:flex; gap:7px; overflow-x:auto; padding-bottom:8px; -webkit-overflow-scrolling:touch;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; border:1px solid #cbd5e1; background:var(--card); color:#334155;
    border-radius:20px; padding:7px 13px; font-size:13px; font-weight:600;
  }
  .chip.on{background:var(--blue); border-color:var(--blue); color:#fff;}

  .btn{
    display:block; width:100%; border:none; border-radius:10px;
    padding:13px; font-size:15px; font-weight:700; text-align:center; margin-top:4px;
  }
  .btn-primary{background:var(--blue); color:#fff;}
  .btn-danger{background:#fee2e2; color:#b91c1c;}
  .btn-ok{background:#dcfce7; color:#15803d;}
  .btn-ghost{background:var(--line); color:#334155;}
  .btn-sm{padding:9px; font-size:14px; margin-top:0;}
  .btn:disabled{opacity:.5;}
  .btn-pair{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;}

  /* ---------- SKJEMA ---------- */
  .field{margin-bottom:12px;}
  .field > label{display:block; font-size:12px; font-weight:600; color:#475569; margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid #cbd5e1; border-radius:8px;
    padding:11px 12px; background:var(--card); color:var(--text);
    -webkit-appearance:none; appearance:none;
  }
  .field input[type="date"]{min-height:44px;}
  .field textarea{min-height:70px; resize:vertical;}
  .field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%2364748b' stroke-width='2' fill='none' stroke-linecap='round'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:34px;}
  .field-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .check{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .check input{width:auto; -webkit-appearance:auto; appearance:auto; transform:scale(1.3); margin:0 2px;}
  .check label{font-size:14px; font-weight:600; color:#334155; margin:0;}
  .hint{font-size:12px; color:var(--muted); margin:-6px 0 12px;}
  .hint.warn{color:var(--red); font-weight:600;}

  .swatches{display:flex; flex-wrap:wrap; gap:9px;}
  .swatch{width:34px; height:34px; border-radius:17px; border:3px solid transparent;}
  .swatch.on{border-color:var(--text);}

  /* ---------- MODAL ---------- */
  .modal{
    position:fixed; inset:0; z-index:150; background:var(--bg);
    display:none; flex-direction:column;
  }
  .modal.on{display:flex;}
  .modal .mhead{
    flex:0 0 auto; background:var(--card); border-bottom:1px solid var(--border);
    padding:calc(12px + var(--safe-top)) 14px 12px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .modal .mhead h3{font-size:16px; font-weight:700; margin:0; flex:1; min-width:0;}
  .modal .mhead button{background:none; border:none; color:var(--blue); font-weight:600; font-size:15px; padding:4px;}
  .modal .mbody{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px calc(28px + var(--safe-bottom));}

  /* ---------- KALENDER ---------- */
  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .cal-nav button{background:none; border:none; color:var(--blue); font-size:26px; font-weight:700; padding:0 18px; line-height:1;}
  .cal-nav .m{font-size:16px; font-weight:700;}
  .cal-wd{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:2px;}
  .cal-wd span{text-align:center; font-size:11px; font-weight:600; color:var(--muted);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
  .cal-cell{
    aspect-ratio:1; border-radius:7px; background:var(--card); border:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding-top:4px; gap:2px; font-size:13px; font-weight:600;
  }
  .cal-cell.blank{background:transparent; border-color:transparent;}
  .cal-cell.today{background:#fef9c3;}
  .cal-cell.sel{background:#dbeafe; border-color:var(--blue);}
  .cal-dots{display:flex; gap:2px; flex-wrap:wrap; justify-content:center;}
  .cal-dot{width:5px; height:5px; border-radius:3px;}

  /* ---------- SKADEBILDER ---------- */
  .thumbs{display:flex; flex-wrap:wrap; gap:8px;}
  .thumb{position:relative; width:76px; height:76px;}
  .thumb img{width:100%; height:100%; object-fit:cover; border-radius:8px; background:var(--line);}
  .thumb button.rm{
    position:absolute; top:-6px; right:-6px; width:22px; height:22px; border-radius:11px;
    background:var(--red); color:#fff; border:none; font-size:13px; line-height:1; padding:0;
  }
  .thumb button.save{
    position:absolute; bottom:0; left:0; right:0; height:22px;
    border:none; border-radius:0 0 8px 8px; padding:0;
    background:rgba(15,23,42,0.62); color:#fff; font-size:11px; line-height:22px;
  }
  .bilkost{padding:10px 0; border-top:1px solid var(--line);}
  .bilkost:first-child{border-top:none; padding-top:2px;}
  .bilkost-topp{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .bilkost-topp .t{font-weight:700; font-size:15px;}
  .bilkost-sum{font-weight:800; font-size:16px; color:var(--red);}
  .bilkost-rad{display:flex; gap:10px; margin-top:6px;}
  .bilkost-rad > div{flex:1; background:var(--bg); border-radius:8px; padding:6px 8px;}
  .bilkost-lab{font-size:10px; text-transform:uppercase; letter-spacing:.3px; color:var(--muted); font-weight:600;}
  .bilkost-tall{font-size:14px; font-weight:700; margin-top:1px;}
  .oppgjor-linje{
    display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    padding:6px 0; font-size:14px; color:var(--text);
    border-top:1px solid var(--line);
  }
  .oppgjor-linje:first-child{border-top:none;}
  .oppgjor-linje.neg span:last-child{color:var(--red); font-weight:600;}
  .oppgjor-linje.muted{color:var(--muted);}
  .oppgjor-linje.sum{
    border-top:2px solid var(--border); margin-top:2px; padding-top:8px;
    font-weight:800; font-size:16px;
  }
  .oppgjor-linje.sum span:last-child{color:var(--green);}
  .oppgjor-linje.sum.kost span:last-child{color:var(--red);}
  .addphoto{
    width:76px; height:76px; border-radius:8px; border:1px dashed #cbd5e1;
    background:var(--card); color:var(--muted); font-size:24px;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- TOAST ---------- */
  #toast{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(80px + var(--safe-bottom)); z-index:300;
    background:#0f172a; color:#fff; padding:11px 18px; border-radius:24px;
    font-size:14px; font-weight:600; max-width:88%; text-align:center;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  #toast.on{opacity:.95;}
</style>
</head>
<body>

<!-- ===================== INNLOGGING ===================== -->
<div id="login-overlay">
  <div class="logo">🚐</div>
  <h1>Bobil Booking</h1>
  <p id="login-status">Sjekker innlogging …</p>
  <div class="box">
    <div class="field">
      <label for="login-password">Passord</label>
      <input type="password" id="login-password" autocomplete="current-password" placeholder="Ditt passord">
    </div>
    <div class="hint warn" id="login-error" style="display:none"></div>
    <button class="btn btn-primary" id="login-btn">Logg inn</button>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app-root">
  <header>
    <div>
      <div class="title">🚐 Bobil Booking</div>
      <div class="sub" id="sync-status">Admin</div>
    </div>
    <button id="logout-btn">Logg ut</button>
  </header>

  <main id="content"></main>

  <nav id="tabbar">
    <button data-tab="oversikt"  class="active"><span class="ic">📊</span>Oversikt</button>
    <button data-tab="kalender"><span class="ic">🗓️</span>Kalender</button>
    <button data-tab="bookinger"><span class="ic">📋</span>Bookinger</button>
    <button data-tab="biler"><span class="ic">🚐</span>Biler</button>
    <button data-tab="mer"><span class="ic">⋯</span>Mer<span class="badge" id="req-badge" style="display:none">0</span></button>
  </nav>
</div>

<!-- ===================== MODALER ===================== -->
<div class="modal" id="modal">
  <div class="mhead">
    <h3 id="modal-title">Rediger</h3>
    <button id="modal-close">Lukk</button>
  </div>
  <div class="mbody" id="modal-body"></div>
</div>

<div id="toast"></div>

<script>
/* =========================================================================
   Bobil Booking — mobil admin (PWA)
   Samme Supabase-database og samme datamodell som bobil_booking.html.
   ========================================================================= */

const SUPABASE_URL = "https://kydkjszbgdgvvkiicftg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_maTxWGDwgcVBnpaCLNKGFA_UmrrPGLx";
const AUTH_EMAIL = "steffen.skaar@gmail.com";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true }
});

const STORAGE_KEY = "bobilBookingData_v1";
const PREV_KEY = "bobilBookingData_v1_forrige";   /* automatisk sikkerhetsnett */
const STD_INKL_KM = 200;    /* inkluderte kilometer per døgn */
const STD_KM_PRIS = 3.5;    /* kroner per kilometer utover grensen */
let DB = { vehicles: [], customers: [], bookings: [], costs: [], fixedCosts: [], settings: {} };
let saveTimer = null;
let currentTab = "oversikt";
/* Sant fra du endrer noe til skyen har bekreftet at den har mottatt det.
   Så lenge dette er sant skal INGENTING overskrive de lokale dataene. */
let unsavedChanges = false;
let lastSaveError = "";

/* ===================== DATALAG ===================== */
function setSyncStatus(t){ const el = document.getElementById("sync-status"); if(el) el.textContent = t; }

function applyMigrations(){
  if(!DB.fixedCosts) DB.fixedCosts = [];
  if(!DB.settings) DB.settings = {};
  ["vehicles","customers","bookings","costs"].forEach(k=>{ if(!DB[k]) DB[k] = []; });
  DB.vehicles.forEach(v=>{
    /* Km-grense og pris for overkjørte km. Standard: 200 km i døgnet, 3,50 kr/km. */
    if(v.includedKmPerDay === undefined || v.includedKmPerDay === null || v.includedKmPerDay === "") v.includedKmPerDay = STD_INKL_KM;
    if(v.extraKmPrice === undefined || v.extraKmPrice === null || v.extraKmPrice === "") v.extraKmPrice = STD_KM_PRIS;
    if(v.inServiceFrom === undefined) v.inServiceFrom = "";   /* "ÅÅÅÅ-MM" */
  });
  DB.bookings.forEach(b=>{
    if(b.depositPaid === undefined) b.depositPaid = false;
    if(b.depositReturned === undefined) b.depositReturned = false;
    if(b.rentPaid === undefined) b.rentPaid = false;
    if(b.damageImages === undefined) b.damageImages = [];
    if(b.tripCosts === undefined) b.tripCosts = 0;          /* AutoPASS, ferje, drivstoff … */
    if(b.tripCostsNotes === undefined) b.tripCostsNotes = "";
    /* Bilder har historisk vært lagret på to måter: som ren tekststreng
       (data:image/...) og som objekt {name, dataUrl}. Vi lagrer nå alltid
       objekt, slik at nettsiden, mobilappen og Expo-appen viser de samme
       bildene. Gamle strenger konverteres her. */
    if(Array.isArray(b.damageImages)){
      b.damageImages = b.damageImages
        .map(im => typeof im === "string" ? { name: "skadefoto.jpg", dataUrl: im } : im)
        .filter(im => im && im.dataUrl);
    } else b.damageImages = [];
  });
}

/* Leser bildekilden uansett hvilket av de to formatene bildet er lagret i. */
function imgSrc(im){
  if(!im) return "";
  return typeof im === "string" ? im : (im.dataUrl || "");
}

/* Hvor mye plass dataene tar (bildene er nesten alt). */
function dbSizeMB(){ return JSON.stringify(DB).length / 1048576; }

function loadLocal(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ try{ DB = JSON.parse(raw); }catch(e){ console.error(e); } }
  applyMigrations();
  /* Har migreringen endret noe (f.eks. gjort om bilder fra tekststreng til
     objekt), lagrer vi det med én gang så det ikke må gjøres om igjen. */
  const after = JSON.stringify(DB);
  if(raw && after !== raw){ try{ localStorage.setItem(STORAGE_KEY, after); }catch(e){} }
}

function saveData(){
  unsavedChanges = true;
  lastSaveError = "";
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
  }catch(e){
    /* Nesten alltid: telefonen er full for denne appen (som regel for mange
       eller for store bilder). Dette MÅ vises — før svelget vi det i stillhet,
       og da så alt ut til å gå bra helt til dataene var borte. */
    console.error(e);
    lastSaveError = "Får ikke plass til dataene på telefonen (" + Math.round(dbSizeMB()*10)/10 + " MB). Slett noen skadebilder.";
    setSyncStatus("⚠️ IKKE lagret");
    alert("Kunne ikke lagre på telefonen:\n\n" + lastSaveError +
          "\n\nEndringen er foreløpig bare i minnet. Slett noen bilder og lagre på nytt.");
  }
  setSyncStatus("Lagrer …");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushToCloud, 600);
}

async function pushToCloud(){
  try{
    const { data: s } = await supabaseClient.auth.getSession();
    const userId = s && s.session ? s.session.user.id : null;
    if(!userId) return;
    const { error } = await supabaseClient.from("app_state").upsert(
      { user_id: userId, data: DB, updated_at: new Date().toISOString() },
      { onConflict: "user_id" }
    );
    if(error) throw error;
    unsavedChanges = false;
    lastSaveError = "";
    setSyncStatus("☁️ Lagret i skyen");
    syncPublicData();
  }catch(e){
    console.error(e);
    /* Viktig: unsavedChanges blir stående sann, slik at pullFromCloud ikke
       får lov til å overskrive endringen med den gamle utgaven fra skyen. */
    lastSaveError = (e && e.message) ? e.message : "ukjent feil";
    setSyncStatus("⚠️ Ikke lagret i skyen — prøver igjen");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(pushToCloud, 8000);
  }
}

async function syncPublicData(){
  try{
    const { data: s } = await supabaseClient.auth.getSession();
    if(!s || !s.session) return;
    if(DB.vehicles.length > 0){
      await supabaseClient.from("public_vehicles").upsert(DB.vehicles.map(v=>({
        id: v.id, name: v.name, regnr: v.regnr||"",
        daily_rate: v.dailyRate||0, weekend_rate: v.weekendRate||0,
        high_season_rate: v.highSeasonRate||0,
        hs_start: v.hsStart||"", hs_end: v.hsEnd||"",
        color: v.color||"#3b82f6", notes: v.notes||""
      })));
    }
    const ids = DB.vehicles.map(v=>v.id);
    if(ids.length > 0){
      await supabaseClient.from("public_vehicles").delete()
        .not("id","in","("+ids.map(id=>'"'+id+'"').join(",")+")");
    } else {
      await supabaseClient.from("public_vehicles").delete().neq("id","__never__");
    }
    await supabaseClient.from("public_bookings").delete().neq("id","__never__");
    const active = DB.bookings.filter(b=>b.status!=="avlyst");
    if(active.length > 0){
      await supabaseClient.from("public_bookings").insert(active.map(b=>({
        id: b.id, vehicle_id: b.vehicleId, start_date: b.startDate, end_date: b.endDate
      })));
    }
  }catch(e){ console.error("syncPublicData feilet:", e); }
}

async function pullFromCloud(){
  try{
    const { data: s } = await supabaseClient.auth.getSession();
    const userId = s && s.session ? s.session.user.id : null;
    if(!userId) return false;
    const { data, error } = await supabaseClient.from("app_state")
      .select("data").eq("user_id", userId).maybeSingle();
    if(error) throw error;
    if(unsavedChanges){
      /* Vi har endringer som skyen ennå ikke har bekreftet. Å hente ned nå
         ville slettet dem. Vi prøver heller å sende dem opp igjen. */
      setSyncStatus("⚠️ Ikke lagret i skyen — prøver igjen");
      pushToCloud();
      return true;
    }
    if(data && data.data){
      /* Sikkerhetsnett: behold utgaven vi har nå, før skyen overskriver den.
         Skulle noe forsvinne, kan det hentes tilbake under «Mer». */
      snapshotPrevious();
      DB = data.data;
      applyMigrations();
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){ console.error(e); }
      setSyncStatus("☁️ Synkronisert");
    } else {
      await pushToCloud();
      setSyncStatus("☁️ Tilkoblet");
    }
    return true;
  }catch(e){
    console.error(e);
    setSyncStatus("⚠️ Offline — viser lagret data");
    return false;
  }
}

/* Lagrer nåværende utgave som «forrige versjon». Er det ikke plass, prøver vi
   på nytt uten bildene — da berges i det minste bookinger, kunder og priser. */
function snapshotPrevious(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw) return;
  const stamp = new Date().toISOString();
  try{
    localStorage.setItem(PREV_KEY, JSON.stringify({ savedAt: stamp, utenBilder: false, data: JSON.parse(raw) }));
    return;
  }catch(e){ /* trolig full — prøv uten bilder */ }
  try{
    const slank = JSON.parse(raw);
    (slank.bookings || []).forEach(b => { b.damageImages = []; });
    localStorage.setItem(PREV_KEY, JSON.stringify({ savedAt: stamp, utenBilder: true, data: slank }));
  }catch(e){ console.error("klarte ikke å ta vare på forrige versjon", e); }
}

function readPrevious(){
  try{
    const raw = localStorage.getItem(PREV_KEY);
    if(!raw) return null;
    const o = JSON.parse(raw);
    return (o && o.data) ? o : null;
  }catch(e){ return null; }
}

/* Teller innhold, slik at han kan se hva en sikkerhetskopi faktisk inneholder
   FØR han gjenoppretter den. */
function summarise(d){
  if(!d) return "tom";
  let bilder = 0;
  (d.bookings || []).forEach(b => bilder += (b.damageImages || []).length);
  return (d.bookings||[]).length + " bookinger · " + (d.vehicles||[]).length + " biler · " +
         (d.customers||[]).length + " kunder · " + ((d.costs||[]).length + (d.fixedCosts||[]).length) + " kostnader · " +
         bilder + " bilder";
}

/* Laster ned alt som én fil. Samme format som «Eksporter data» på nettsiden. */
async function lastNedSikkerhetskopi(){
  const navn = "bobil-sikkerhetskopi-" + todayISO() + ".json";
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
  try{
    const file = new File([blob], navn, { type: "application/json" });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: navn });
      return;
    }
  }catch(e){ if(e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = navn;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 60000);
  showToast("Sikkerhetskopi lastet ned");
}

/* Tar imot en fil og legger den inn — etter at han har sett hva den inneholder. */
function gjenopprettFraFil(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let d;
    try{ d = JSON.parse(reader.result); }
    catch(e){ alert("Denne filen er ikke en gyldig sikkerhetskopi."); return; }
    if(!d || !Array.isArray(d.bookings) || !Array.isArray(d.vehicles)){
      alert("Denne filen ser ikke ut som en sikkerhetskopi fra Bobil Booking."); return;
    }
    if(!confirm("Gjenopprette denne sikkerhetskopien?\n\nFilen inneholder:\n" + summarise(d) +
                "\n\nDu har nå:\n" + summarise(DB) +
                "\n\nDet du har nå blir erstattet.")) return;
    snapshotPrevious();
    DB = d; applyMigrations(); saveData(); render();
    showToast("Sikkerhetskopi gjenopprettet");
  };
  reader.onerror = ()=> alert("Klarte ikke å lese filen.");
  reader.readAsText(file);
}

function gjenopprettForrige(){
  const prev = readPrevious();
  if(!prev){ alert("Det finnes ingen tidligere versjon å hente tilbake."); return; }
  if(!confirm("Hente tilbake versjonen fra " + fmtDate(prev.savedAt.slice(0,10)) + "?\n\n" +
              "Den inneholder:\n" + summarise(prev.data) +
              (prev.utenBilder ? "\n(uten skadebilder — det var ikke plass til dem)" : "") +
              "\n\nDu har nå:\n" + summarise(DB) +
              "\n\nDet du har nå blir erstattet.")) return;
  DB = prev.data; applyMigrations(); saveData(); render();
  showToast("Forrige versjon hentet tilbake");
}

/* =====================================================================
   DEPOSITUMSOPPGJØR
   Hva skal trekkes fra depositumet, og hva gjenstår til utbetaling?
   ===================================================================== */
function depositOppgjor(b){
  const v = vehicleById(b.vehicleId);
  const netter = (b.startDate && b.endDate) ? nightsBetween(b.startDate, b.endDate) : 0;
  const inklPerDogn = v && v.includedKmPerDay !== undefined && v.includedKmPerDay !== "" ? Number(v.includedKmPerDay) : STD_INKL_KM;
  const kmPris = v && v.extraKmPrice !== undefined && v.extraKmPrice !== "" ? Number(v.extraKmPrice) : STD_KM_PRIS;

  const inkludert = Math.max(0, netter) * inklPerDogn;
  const harKm = b.kmStart !== undefined && b.kmStart !== null && b.kmStart !== "" &&
                b.kmEnd   !== undefined && b.kmEnd   !== null && b.kmEnd   !== "";
  const kjort = harKm ? Math.max(0, Number(b.kmEnd) - Number(b.kmStart)) : 0;
  const overkjort = harKm ? Math.max(0, kjort - inkludert) : 0;
  const kmBelop = Math.round(overkjort * kmPris);

  const reise = Number(b.tripCosts) || 0;
  const depositum = Number(b.deposit) || 0;
  const trekk = kmBelop + reise;
  const tilUtbetaling = Math.max(0, depositum - trekk);
  /* Overstiger trekket depositumet, skylder kunden mellomlegget. */
  const restKrav = Math.max(0, trekk - depositum);

  return { netter, inklPerDogn, kmPris, inkludert, harKm, kjort, overkjort,
           kmBelop, reise, depositum, trekk, tilUtbetaling, restKrav };
}

/* =====================================================================
   KOSTNAD PER BIL — løpende fra måneden bilen kom i drift
   ===================================================================== */
function maanedNr(ym){                       /* "2024-03" -> antall måneder siden år 0 */
  if(!ym || !/^\d{4}-\d{2}$/.test(ym)) return null;
  return Number(ym.slice(0,4)) * 12 + Number(ym.slice(5,7)) - 1;
}
function inneUM(){                            /* inneværende måned som "ÅÅÅÅ-MM" */
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}

/* Måneden bilen kom i drift. Er den ikke fylt ut, faller vi tilbake på den
   eldste kostnaden eller bookingen vi kjenner til, slik at tallet gir mening
   fra dag én uten at han må fylle ut noe. */
function driftStart(v){
  if(v.inServiceFrom && /^\d{4}-\d{2}$/.test(v.inServiceFrom)) return v.inServiceFrom;
  const datoer = [];
  DB.costs.forEach(k=>{ if(k.vehicleId === v.id && k.date) datoer.push(k.date.slice(0,7)); });
  DB.bookings.forEach(b=>{ if(b.vehicleId === v.id && b.startDate) datoer.push(b.startDate.slice(0,7)); });
  datoer.sort();
  return datoer.length ? datoer[0] : inneUM();
}

function bilKostnad(v){
  const start = driftStart(v);
  const naa = inneUM();
  const fra = maanedNr(start), til = maanedNr(naa);
  const maaneder = (fra === null || til === null) ? 1 : Math.max(1, til - fra + 1);

  const fastPerMnd = DB.fixedCosts
    .filter(f=> f.vehicleId === v.id && f.active !== false)
    .reduce((s,f)=> s + (Number(f.amountPerMonth)||0), 0);

  /* Engangskostnader fra og med driftsmåneden. */
  const engangs = DB.costs
    .filter(k=> k.vehicleId === v.id && k.date && k.date.slice(0,7) >= start)
    .reduce((s,k)=> s + (Number(k.amount)||0), 0);

  const fastTotalt = fastPerMnd * maaneder;
  const hittil = fastTotalt + engangs;

  /* I år: engangskostnader i inneværende kalenderår, pluss faste for de
     månedene bilen faktisk har vært i drift i år. */
  const aar = String(new Date().getFullYear());
  const engangsIAar = DB.costs
    .filter(k=> k.vehicleId === v.id && k.date && k.date.slice(0,4) === aar && k.date.slice(0,7) >= start)
    .reduce((s,k)=> s + (Number(k.amount)||0), 0);
  const fraIAar = maanedNr(start > aar+"-01" ? start : aar+"-01");
  const mndIAar = Math.max(0, (til - fraIAar) + 1);
  const faktiskIAar = engangsIAar + fastPerMnd * mndIAar;

  return { start, maaneder, fastPerMnd, fastTotalt, engangs, hittil,
           aarligBudsjett: fastPerMnd * 12, faktiskIAar, mndIAar,
           snittPerMnd: maaneder ? Math.round(hittil / maaneder) : 0 };
}

function fmtMaaned(ym){
  if(!ym || !/^\d{4}-\d{2}$/.test(ym)) return "–";
  return NB_MONTHS[Number(ym.slice(5,7))-1] + " " + ym.slice(0,4);
}

/* ===================== HJELPERE ===================== */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtKr(n){ return (Math.round(n||0)).toLocaleString("nb-NO") + " kr"; }
function fmtDate(d){ if(!d) return "—"; return new Date(d+"T00:00:00").toLocaleDateString("nb-NO",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function toISO(date){ const y=date.getFullYear(), m=String(date.getMonth()+1).padStart(2,"0"), d=String(date.getDate()).padStart(2,"0"); return y+"-"+m+"-"+d; }
function todayISO(){ return toISO(new Date()); }
function addDays(dateStr, n){ const d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return toISO(d); }
function nightsBetween(start, end){
  const s = new Date(start+"T00:00:00"), e = new Date(end+"T00:00:00");
  return Math.round((e-s)/86400000);
}
function isWeekendNight(dateStr){ const day = new Date(dateStr+"T00:00:00").getDay(); return day===5 || day===6; }
function isHighSeason(dateStr, vehicle){
  if(!vehicle.hsStart || !vehicle.hsEnd) return false;
  const date = new Date(dateStr+"T00:00:00");
  const mmdd = (date.getMonth()+1)*100 + date.getDate();
  const parse = (s)=>{ const p = s.split("."); return parseInt(p[1],10)*100 + parseInt(p[0],10); };
  const a = parse(vehicle.hsStart), b = parse(vehicle.hsEnd);
  return a <= b ? (mmdd >= a && mmdd <= b) : (mmdd >= a || mmdd <= b);
}
function calcPrice(vehicle, start, end){
  const n = nightsBetween(start, end);
  let total = 0, counts = {high:0, weekend:0, normal:0};
  for(let i=0;i<n;i++){
    const night = addDays(start, i);
    if(isHighSeason(night, vehicle) && vehicle.highSeasonRate){ total += vehicle.highSeasonRate; counts.high++; }
    else if(isWeekendNight(night) && vehicle.weekendRate){ total += vehicle.weekendRate; counts.weekend++; }
    else { total += (vehicle.dailyRate||0); counts.normal++; }
  }
  const parts = [];
  if(counts.high) parts.push(counts.high+" natt høysesong à "+fmtKr(vehicle.highSeasonRate));
  if(counts.weekend) parts.push(counts.weekend+" natt helg à "+fmtKr(vehicle.weekendRate));
  if(counts.normal) parts.push(counts.normal+" natt normal à "+fmtKr(vehicle.dailyRate));
  return { total, nights: n, breakdown: parts.join(", ") || "Ingen netter valgt" };
}
function overlaps(aStart, aEnd, bStart, bEnd){ return aStart < bEnd && bStart < aEnd; }
function vehicleById(id){ return DB.vehicles.find(v=>v.id===id); }
function customerById(id){ return DB.customers.find(c=>c.id===id); }
function bookingById(id){ return DB.bookings.find(b=>b.id===id); }
function totalMonthlyFixedCosts(){
  return DB.fixedCosts.filter(f=>f.active!==false).reduce((s,f)=>s+Number(f.amountPerMonth||0),0);
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("on"), 2600);
}

const SUBVIEWS = { kunder:"Kunder", kostnader:"Kostnader", foresporsler:"Forespørsler" };

  currentTab = tab;

/* ===================== OVERSIKT ===================== */
function viewOversikt(){
  const today = todayISO();
  const now = new Date(), y = now.getFullYear();
  const monthStart = y + "-" + String(now.getMonth()+1).padStart(2,"0") + "-01";
  const nextMonth = now.getMonth() === 11 ? (y+1)+"-01-01" : y + "-" + String(now.getMonth()+2).padStart(2,"0") + "-01";
  const yearStart = y + "-01-01", nextYear = (y+1) + "-01-01";
  const inMonth = d => d >= monthStart && d < nextMonth;
  const inYear  = d => d >= yearStart && d < nextYear;

  const confirmed = DB.bookings.filter(b=>b.status === "bekreftet");
  const monthRevenue = confirmed.filter(b=>inMonth(b.startDate)).reduce((s,b)=>s+Number(b.totalPrice||0),0);
  const yearRevenue  = confirmed.filter(b=>inYear(b.startDate)).reduce((s,b)=>s+Number(b.totalPrice||0),0);
  const monthFixed = totalMonthlyFixedCosts();
  const yearFixed  = monthFixed * (now.getMonth()+1);
  const monthOneOff = DB.costs.filter(k=>inMonth(k.date)).reduce((s,k)=>s+Number(k.amount||0),0);
  const yearOneOff  = DB.costs.filter(k=>inYear(k.date)).reduce((s,k)=>s+Number(k.amount||0),0);
  const monthCosts = monthOneOff + monthFixed, yearCosts = yearOneOff + yearFixed;
  const monthProfit = monthRevenue - monthCosts, yearProfit = yearRevenue - yearCosts;

  const daysInMonth = new Date(y, now.getMonth()+1, 0).getDate();
  const totalAvailable = DB.vehicles.length * daysInMonth;
  let bookedNights = 0;
  confirmed.forEach(b=>{
    const s = b.startDate > monthStart ? b.startDate : monthStart;
    const e = b.endDate   < nextMonth  ? b.endDate   : nextMonth;
    if(e > s) bookedNights += nightsBetween(s, e);
  });
  const occupancy = totalAvailable > 0 ? Math.round((bookedNights/totalAvailable)*100) : 0;

  const upcoming = DB.bookings.filter(b=>b.status!=="avlyst" && b.endDate >= today)
    .sort((a,b)=>a.startDate.localeCompare(b.startDate)).slice(0,6);

  const attention = DB.bookings.filter(b=>{
    if(b.status === "avlyst") return false;
    const dep = b.deposit > 0 && !b.depositPaid && b.startDate <= addDays(today,7) && b.startDate >= today;
    const ret = b.deposit > 0 && b.depositPaid && !b.depositReturned && b.endDate <= today;
    const rent = !b.rentPaid && b.startDate <= today;
    return dep || ret || rent;
  }).sort((a,b)=>a.endDate.localeCompare(b.endDate));

  const perVehicle = DB.vehicles.map(v=>({
    v, rev: confirmed.filter(b=>b.vehicleId===v.id && inYear(b.startDate)).reduce((s,b)=>s+Number(b.totalPrice||0),0)
  })).sort((a,b)=>b.rev-a.rev);
  const maxRev = Math.max(1, ...perVehicle.map(r=>r.rev));

  const kpi = (lbl, val, sub, cls) =>
    '<div class="kpi"><div class="lbl">'+lbl+'</div><div class="val '+(cls||"")+'">'+val+'</div>'+
    (sub ? '<div class="sub">'+sub+'</div>' : '')+'</div>';

  let html = '<h2 class="section">Denne måneden</h2><div class="kpis">'+
    kpi("Inntekt", fmtKr(monthRevenue), "Bekreftede bookinger", "green")+
    kpi("Kostnader", fmtKr(monthCosts), "herav "+fmtKr(monthFixed)+" faste", "red")+
    kpi("Resultat", fmtKr(monthProfit), "", monthProfit>=0?"green":"red")+
    kpi("Belegg", occupancy+"%", bookedNights+" av "+totalAvailable+" netter")+
  '</div>';

  html += '<h2 class="section">Hittil i år ('+y+')</h2><div class="kpis">'+
    kpi("Inntekt i år", fmtKr(yearRevenue), "", "green")+
    kpi("Kostnader i år", fmtKr(yearCosts), "herav "+fmtKr(yearFixed)+" faste", "red")+
    kpi("Resultat i år", fmtKr(yearProfit), "", yearProfit>=0?"green":"red")+
    kpi("Antall biler", String(DB.vehicles.length), DB.customers.length+" kunder")+
  '</div>';

  html += '<div class="panel"><h3>Inntekt per bil i år</h3>' +
    (perVehicle.length === 0 ? '<p class="empty">Ingen biler lagt til ennå.</p>' :
      perVehicle.map(r=>
        '<div class="bar-row"><div class="bar-top"><span>'+esc(r.v.name)+'</span><span>'+fmtKr(r.rev)+'</span></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+((r.rev/maxRev)*100)+'%;background:'+esc(r.v.color||"#3b82f6")+'"></div></div></div>'
      ).join("")) + '</div>';

  html += '<div class="panel"><h3>⚠️ Krever oppfølging</h3>' +
    (attention.length === 0 ? '<p class="empty">Ingen åpne saker akkurat nå. 🎉</p>' :
      attention.map(b=>{
        const v = vehicleById(b.vehicleId), c = customerById(b.customerId);
        return '<div class="row tappable" data-open-booking="'+b.id+'"><div class="grow">'+
          '<div class="t">'+esc(v?v.name:"Ukjent bil")+' — '+esc(c?c.name:"Ukjent")+'</div>'+

/* ===================== KALENDER ===================== */
let calCursor = { y: new Date().getFullYear(), m: new Date().getMonth() };
let calSelected = null;

function monthGrid(year, month){
  const first = new Date(year, month, 1);
  const offset = (first.getDay()+6) % 7;
  const days = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<offset;i++) cells.push(null);
  for(let d=1; d<=days; d++) cells.push(d);
  while(cells.length % 7 !== 0) cells.push(null);
  return cells;
}

function viewKalender(){
  const cells = monthGrid(calCursor.y, calCursor.m);
  const today = todayISO();
  const active = DB.bookings.filter(b=>b.status!=="avlyst");

  let html = '<div class="panel"><div class="cal-nav">'+
    '<button id="cal-prev">‹</button><span class="m">'+NB_MONTHS[calCursor.m]+' '+calCursor.y+'</span>'+
    '<button id="cal-next">›</button></div>'+
    '<div class="cal-wd">'+NB_WEEKDAYS.map(w=>'<span>'+w+'</span>').join("")+'</div><div class="cal-grid">';

  cells.forEach((d,i)=>{
    if(d === null){ html += '<div class="cal-cell blank"></div>'; return; }
    const iso = toISO(new Date(calCursor.y, calCursor.m, d));
    const onDay = active.filter(b=> iso >= b.startDate && iso < b.endDate);
    const dots = onDay.slice(0,4).map(b=>{
      const v = vehicleById(b.vehicleId);
      return '<span class="cal-dot" style="background:'+esc(v && v.color ? v.color : "#3b82f6")+'"></span>';
    }).join("");
    const cls = "cal-cell" + (iso === today ? " today" : "") + (iso === calSelected ? " sel" : "");
    html += '<div class="'+cls+'" data-day="'+iso+'"><span>'+d+'</span><span class="cal-dots">'+dots+'</span></div>';
  });
  html += '</div></div>';

  if(calSelected){
    const onDay = active.filter(b=> calSelected >= b.startDate && calSelected < b.endDate);
    html += '<div class="panel"><h3>'+fmtDate(calSelected)+'</h3>'+
      (onDay.length === 0 ? '<p class="empty">Ingen bookinger denne dagen.</p>' : onDay.map(bookingRow).join(""))+
      '</div>';
  } else {
    html += '<p class="muted" style="text-align:center">Trykk på en dag for å se bookingene.</p>';
  }
  html += '<button class="btn btn-primary" data-new-booking>+ Ny booking</button>';
  return html;
}

function wireKalender(){
  const prev = document.getElementById("cal-prev"), next = document.getElementById("cal-next");
  if(prev) prev.onclick = ()=>{ const d = new Date(calCursor.y, calCursor.m-1, 1); calCursor = {y:d.getFullYear(), m:d.getMonth()}; render(); };
  if(next) next.onclick = ()=>{ const d = new Date(calCursor.y, calCursor.m+1, 1); calCursor = {y:d.getFullYear(), m:d.getMonth()}; render(); };
  document.querySelectorAll("[data-day]").forEach(el=>{
    el.onclick = ()=>{ calSelected = (calSelected === el.dataset.day) ? null : el.dataset.day; render(); };
  });
}

          (r.message ? '<div class="s" style="font-style:italic">«'+esc(r.message)+'»</div>' : '')+
          '<div class="btn-pair">'+
            '<button class="btn btn-ok btn-sm" data-approve="'+esc(r.id)+'">✓ Godkjenn</button>'+
            '<button class="btn btn-danger btn-sm" data-reject="'+esc(r.id)+'">✗ Avslå</button>'+
          '</div>'+
        '</div>').join("");
    }
    html += '</div>';

    if(handled.length){
      html += '<div class="panel"><h3>Behandlet</h3>'+ handled.slice(0,20).map(r=>
        '<div class="row"><div class="grow"><div class="t">'+esc(r.customer_name)+'</div>'+
        '<div class="s">'+esc(r.vehicle_name||"")+' · '+fmtDate(r.start_date)+' – '+fmtDate(r.end_date)+'</div>'+
        '<div class="pills">'+(r.status === "approved"
          ? '<span class="pill p-ok">Godkjent</span>'
          : '<span class="pill p-bad">Avslått</span>')+'</div></div></div>').join("")+'</div>';
    }

    c.innerHTML = html;
    wireCommon();
    pending.forEach(r=>{
      const ok = c.querySelector('[data-approve="'+r.id+'"]');
      const no = c.querySelector('[data-reject="'+r.id+'"]');
      if(ok) ok.onclick = ()=> approveRequest(r);
      if(no) no.onclick = ()=> rejectRequest(r);
    });
  }catch(e){
    c.innerHTML = backLink("Forespørsler") +
      '<div class="panel"><p class="empty" style="color:var(--red)">Kunne ikke laste forespørsler: '+esc(e.message||e)+'</p></div>';
    wireCommon();
  }
}

async function approveRequest(r){
  const conflict = DB.bookings.find(b=>
    b.vehicleId === r.vehicle_id && b.status !== "avlyst" &&
    overlaps(r.start_date, r.end_date, b.startDate, b.endDate));
  if(conflict){
    alert("Det finnes allerede en booking i denne perioden ("+fmtDate(conflict.startDate)+"–"+fmtDate(conflict.endDate)+"). Håndter overlappen først.");
    return;
  }
  let cust = DB.customers.find(c=> (c.email||"").toLowerCase() === (r.customer_email||"").toLowerCase() && r.customer_email);
  if(!cust){
    cust = { id: uid(), name: r.customer_name, email: r.customer_email||"", phone: r.customer_phone||"", notes: "Opprettet fra forespørsel" };
    DB.customers.push(cust);
  }
  const v = vehicleById(r.vehicle_id);
  const price = v ? calcPrice(v, r.start_date, r.end_date).total : 0;
  DB.bookings.push({
    id: uid(), vehicleId: r.vehicle_id, customerId: cust.id,
    startDate: r.start_date, endDate: r.end_date,
    totalPrice: price, deposit: 0, status: "bekreftet",
    rentPaid: false, depositPaid: false, depositReturned: false,
    damageImages: [], notes: "Opprettet fra forespørsel", createdAt: new Date().toISOString()
  });
  saveData();
  await supabaseClient.from("booking_requests").update({ status: "approved" }).eq("id", r.id);
  showToast("Godkjent — booking opprettet. Husk depositum.");
  loadRequests();
}

async function rejectRequest(r){
  if(!confirm("Avslå denne forespørselen?")) return;
  await supabaseClient.from("booking_requests").update({ status: "rejected" }).eq("id", r.id);
  showToast("Forespørsel avslått.");
  loadRequests();
}

    '<div class="thumbs" id="b-thumbs"></div>'+
    '<input type="file" id="b-photo-input" accept="image/*" multiple style="display:none"></div>';

  html += '<button class="btn btn-primary" id="b-save">Lagre booking</button>';
  if(!isNew) html += '<button class="btn btn-danger" id="b-delete">Slett booking</button>';

  openModal(isNew ? "Ny booking" : "Rediger booking", html);

  /* --- lokal tilstand for bilder + auto-pris --- */

  let priceAuto = isNew || !d.totalPrice;
  /* Har han allerede skrevet inn et returbeløp selv, lar vi det stå i fred. */

  function drawThumbs(){
    const wrap = mb("#b-thumbs");

      '<button class="rm" data-rm="'+i+'">×</button>'+
      '<button class="save" data-save="'+i+'">Lagre</button></div>').join("")+
      '<button class="addphoto" id="b-addphoto">+</button>';

      btn.onclick = ()=>{ images.splice(Number(btn.dataset.rm),1); drawThumbs(); };

    });

  mb("#b-photo-input").onchange = (e)=>{

    files.forEach(file=>{
      pendingPhotos++;
      setSyncStatus("Behandler bilde …");
      shrinkImage(file, (dataUrl)=>{
        pendingPhotos--;
        if(dataUrl) images.push({ name: file.name || "skadefoto.jpg", dataUrl: dataUrl });
        drawThumbs();
        if(pendingPhotos === 0) setSyncStatus(unsavedChanges ? "Ikke lagret ennå" : "Klar");
      });
    });
  };

  function refreshCalc(){
    const v = vehicleById(val("#b-vehicle"));
    const s = val("#b-start"), e = val("#b-end");
    const hint = mb("#b-price-hint"), conflictEl = mb("#b-conflict");
    if(v && s && e && e > s){
      const p = calcPrice(v, s, e);
      hint.textContent = "Forslag: " + fmtKr(p.total) + " for " + p.nights + (p.nights === 1 ? " natt — " : " netter — ") + p.breakdown;
      if(priceAuto) mb("#b-price").value = p.total;
      const c = DB.bookings.find(x=> x.id !== (b?b.id:null) && x.vehicleId === v.id && x.status !== "avlyst" && overlaps(s, e, x.startDate, x.endDate));
      if(c){
        conflictEl.textContent = "⚠️ Denne bilen er allerede booket " + fmtDate(c.startDate) + " – " + fmtDate(c.endDate) + ".";
        conflictEl.style.display = "block";
      } else conflictEl.style.display = "none";
    } else {
      hint.textContent = "Velg bil og gyldige datoer for prisforslag.";
      conflictEl.style.display = "none";
    }
    tegnOppgjor();
  }

  /* Regner ut oppgjøret på nytt fra det som står i skjemaet akkurat nå. */
  function tegnOppgjor(){
    const utkast = {
      vehicleId: val("#b-vehicle"),
      startDate: val("#b-start"), endDate: val("#b-end"),
      deposit: num("#b-deposit"),
      kmStart: val("#b-km-start") !== "" ? num("#b-km-start") : undefined,
      kmEnd:   val("#b-km-end")   !== "" ? num("#b-km-end")   : undefined,
      tripCosts: num("#b-trip")
    };
    const o = depositOppgjor(utkast);

    mb("#b-km-hint").textContent = o.harKm
      ? o.kjort.toLocaleString("nb-NO") + " km kjørt · " + o.inkludert.toLocaleString("nb-NO") +
        " km inkludert (" + o.inklPerDogn + " km × " + o.netter + " døgn)"
      : (o.netter > 0 ? o.inkludert.toLocaleString("nb-NO") + " km inkludert i denne leien" : "");

    const linje = (tekst, belop, klasse) =>
      '<div class="oppgjor-linje'+(klasse?" "+klasse:"")+'"><span>'+tekst+'</span><span>'+belop+'</span></div>';

    let html = linje("Depositum", fmtKr(o.depositum));
    if(!o.harKm){
      html += '<div class="hint">Fyll ut kilometerstand ved henting og levering for å regne ut eventuell overkjøring.</div>';
    } else if(o.overkjort > 0){
      const prisTekst = Number.isInteger(o.kmPris) ? o.kmPris + " kr"
                        : o.kmPris.toFixed(2).replace(".", ",") + " kr";
      html += linje("Overkjørt " + o.overkjort.toLocaleString("nb-NO") + " km × " + prisTekst,
                    "− " + fmtKr(o.kmBelop), "neg");
    } else {
      html += linje("Innenfor km-grensen", "0 kr", "muted");
    }
    if(o.reise > 0) html += linje("Reisekostnader" + (val("#b-trip-notes") ? " (" + esc(val("#b-trip-notes")) + ")" : ""),
                                  "− " + fmtKr(o.reise), "neg");
    html += linje("Til utbetaling", fmtKr(o.tilUtbetaling), "sum");
    if(o.restKrav > 0){
      html += '<div class="hint warn">Trekket er ' + fmtKr(o.restKrav) + ' større enn depositumet. Kunden skylder ' +
              fmtKr(o.restKrav) + ' i tillegg.</div>';
    }
    mb("#b-oppgjor").innerHTML = html;

    /* Fyll ut returbeløpet automatisk — men aldri overskriv et tall han
       selv har skrevet inn. */
    if(returAuto) mb("#b-depret-amount").value = o.tilUtbetaling;
  }

  mb("#b-depret-amount").addEventListener("input", ()=>{ returAuto = false; });
  ["#b-vehicle","#b-start","#b-end","#b-km-start","#b-km-end","#b-deposit","#b-trip","#b-trip-notes"].forEach(sel=>{
    mb(sel).addEventListener("change", refreshCalc);
    mb(sel).addEventListener("input", refreshCalc);
  });
  mb("#b-price").addEventListener("input", ()=>{ priceAuto = false; });
  mb("#b-start").addEventListener("change", ()=>{
    const s = val("#b-start"), e = val("#b-end");
    if(s && e && e <= s) mb("#b-end").value = addDays(s,1);
    refreshCalc();
  });
  mb("#b-deppaid").addEventListener("change", (ev)=>{
    mb("#b-deppaid-wrap").style.display = ev.target.checked ? "block" : "none";
    if(ev.target.checked && !val("#b-deppaid-date")) mb("#b-deppaid-date").value = todayISO();
  });
  mb("#b-depret").addEventListener("change", (ev)=>{
    mb("#b-depret-wrap").style.display = ev.target.checked ? "block" : "none";
    if(ev.target.checked && !val("#b-depret-date")) mb("#b-depret-date").value = todayISO();
  });
  refreshCalc();

  mb("#b-save").onclick = ()=>{
    if(pendingPhotos > 0){
      alert("Vent litt — " + pendingPhotos + " bilde(r) behandles fortsatt. Prøv igjen om et øyeblikk.");
      return;
    }
    const vehicleId = val("#b-vehicle"), customerId = val("#b-customer");
    const startDate = val("#b-start"), endDate = val("#b-end");
    if(!vehicleId){ alert("Velg en bil."); return; }
    if(!customerId){ alert("Velg en kunde."); return; }
    if(!startDate || !endDate || endDate <= startDate){ alert("Returdato må være etter hentedato."); return; }
    const rec = {
      id: b ? b.id : uid(),
      vehicleId, customerId, startDate, endDate,
      totalPrice: num("#b-price"), deposit: num("#b-deposit"),
      status: val("#b-status"),
      rentPaid: chk("#b-rentpaid"),
      depositPaid: chk("#b-deppaid"),
      depositPaidDate: chk("#b-deppaid") ? val("#b-deppaid-date") : "",
      depositReturned: chk("#b-depret"),
      depositReturnedDate: chk("#b-depret") ? val("#b-depret-date") : "",
      depositReturnedAmount: chk("#b-depret") && val("#b-depret-amount") !== "" ? num("#b-depret-amount") : undefined,
      depositNotes: chk("#b-depret") ? val("#b-depnotes") : "",
      kmStart: val("#b-km-start") !== "" ? num("#b-km-start") : undefined,
      kmEnd: val("#b-km-end") !== "" ? num("#b-km-end") : undefined,
      tripCosts: val("#b-trip") !== "" ? num("#b-trip") : 0,
      tripCostsNotes: val("#b-trip-notes"),
      damageNotes: val("#b-damage"),
      damageImages: images,
      notes: val("#b-notes"),
      createdAt: b && b.createdAt ? b.createdAt : new Date().toISOString()
    };
    if(b){
      const idx = DB.bookings.findIndex(x=>x.id===b.id);
      if(idx >= 0) DB.bookings[idx] = rec; else DB.bookings.push(rec);
    }
    else { DB.bookings.push(rec); }
    modalUnsavedCheck = null;
    saveData(); closeModal(true); render();
    showToast(b ? "Booking oppdatert" : "Booking opprettet");
  };

  if(!isNew){
    mb("#b-delete").onclick = ()=>{
      if(!confirm("Slette denne bookingen?")) return;
      DB.bookings = DB.bookings.filter(x=>x.id !== b.id);
      modalUnsavedCheck = null;
      saveData(); closeModal(true); render();
      showToast("Booking slettet");
    };
  }
}

/* Krymper bilder før de lagres, så databasen ikke sprenges */
/* Lagrer et skadebilde ut av appen og inn på telefonen. iOS gir ikke nettsider
   direkte tilgang til Bilder-appen, men delingsarket har «Lagre bilde». */
async function savePhotoToPhone(im){
  const src = imgSrc(im);
  if(!src){ showToast("Fant ikke bildet."); return; }
  const name = (im && im.name) || "skadefoto.jpg";
  try{
    const blob = await (await fetch(src)).blob();
    const file = new File([blob], name, { type: blob.type || "image/jpeg" });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file] });
      return;
    }
    /* Reserveløsning: åpne bildet i eget vindu, så kan han holde fingeren
       på bildet og velge «Legg til i Bilder». */
    const url = URL.createObjectURL(blob);
    const w = window.open(url, "_blank");
    if(!w) showToast("Tillat popup-vinduer for å lagre bildet.");
    setTimeout(()=> URL.revokeObjectURL(url), 60000);
  }catch(e){
    if(e && e.name === "AbortError") return;   /* han avbrøt delingsarket */
    console.error(e);
    showToast("Kunne ikke lagre bildet.");
  }
}

/* Maks 1000 px og kvalitet 0,55 gir ca. 130 KB per bilde — skarpt nok til å
   dokumentere en skade, og lite nok til at mange bilder får plass. */
const IMG_MAX_PX = 1000;
const IMG_QUALITY = 0.55;
const IMG_MAX_BYTES = 700 * 1024;   /* nødbrems per bilde */

function shrinkImage(file, cb){
  const reader = new FileReader();
  reader.onerror = ()=>{
    alert("Klarte ikke å lese bildet «" + (file.name||"") + "». Prøv et annet bilde.");
    cb(null);
  };
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(!w || !h){
        alert("Bildet «" + (file.name||"") + "» kunne ikke leses. Prøv å ta et skjermbilde av det og last opp skjermbildet i stedet.");
        cb(null); return;
      }
      if(w > IMG_MAX_PX || h > IMG_MAX_PX){
        const r = Math.min(IMG_MAX_PX/w, IMG_MAX_PX/h);
        w = Math.round(w*r); h = Math.round(h*r);
      }
      let out = "";
      try{
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        out = canvas.toDataURL("image/jpeg", IMG_QUALITY);
        /* Blir det likevel for stort, komprimer hardere framfor å gi opp. */
        let q = IMG_QUALITY;
        while(out.length > IMG_MAX_BYTES && q > 0.3){
          q -= 0.1;
          out = canvas.toDataURL("image/jpeg", q);
        }
      }catch(err){ console.error(err); out = ""; }

      if(!out || out.indexOf("data:image") !== 0 || out.length > IMG_MAX_BYTES){
        alert("Bildet «" + (file.name||"") + "» ble for stort til å lagres, og ble ikke lagt til.");
        cb(null); return;
      }
      cb(out);
    };
    /* VIKTIG: her lå feilen. Før falt vi tilbake til originalbildet i full
       størrelse (flere MB). Noen slike bilder fylte opp lagringen, lagringen
       feilet i stillhet, og bildene forsvant. Nå gir vi heller beskjed. */
    img.onerror = ()=>{
      alert("Telefonen klarte ikke å åpne bildet «" + (file.name||"") + "» (kan være HEIC-format).\n\n" +
            "Tips: åpne bildet i Bilder-appen, trykk Rediger og lagre det — eller ta et skjermbilde av det — og prøv igjen.");
      cb(null);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function openFixedModal(id){
  const f = id ? DB.fixedCosts.find(x=>x.id===id) : null;
  const d = f || { vehicleId: DB.vehicles[0]?DB.vehicles[0].id:"", category: FIXED_COST_CATEGORIES[0], amountPerMonth:"", active:true };
  let html = "";
  html += selectField("f-vehicle","Bil", DB.vehicles.map(v=>({v:v.id,l:v.name})), d.vehicleId, DB.vehicles.length?null:"Ingen biler");
  html += selectField("f-category","Kategori", FIXED_COST_CATEGORIES.map(c=>({v:c,l:c})), d.category);
  html += textField("f-amount","Beløp per måned (kr)", d.amountPerMonth, "number", "0", ' inputmode="numeric"');
  html += checkField("f-active","Aktiv (regnes med i kostnadene)", d.active !== false);
  html += '<button class="btn btn-primary" id="f-save">Lagre fast kostnad</button>';
  if(f) html += '<button class="btn btn-danger" id="f-delete">Slett fast kostnad</button>';

  openModal(f ? "Rediger fast kostnad" : "Ny fast kostnad", html);

  mb("#f-save").onclick = ()=>{
    if(!val("#f-vehicle")){ alert("Legg til en bil først."); return; }
    const rec = { id: f?f.id:uid(), vehicleId: val("#f-vehicle"), category: val("#f-category"), amountPerMonth: num("#f-amount"), active: chk("#f-active") };
    if(f){ DB.fixedCosts[DB.fixedCosts.findIndex(x=>x.id===f.id)] = rec; } else { DB.fixedCosts.push(rec); }
    saveData(); closeModal(); render();
    showToast(f ? "Fast kostnad oppdatert" : "Fast kostnad lagt til");
  };
  if(f){
    mb("#f-delete").onclick = ()=>{
      if(!confirm("Slette denne faste kostnaden?")) return;
      DB.fixedCosts = DB.fixedCosts.filter(x=>x.id !== f.id);
      saveData(); closeModal(); render();
      showToast("Fast kostnad slettet");
    };
  }
}

/* ===================== INNLOGGING / OPPSTART ===================== */
function showLogin(msg){
  document.getElementById("login-overlay").style.display = "flex";
  document.getElementById("app-root").classList.remove("on");
  if(msg !== undefined) document.getElementById("login-status").textContent = msg;
}
function showApp(){
  document.getElementById("login-overlay").style.display = "none";
  document.getElementById("app-root").classList.add("on");
  setTab("oversikt");
  refreshBadge();
}

async function doLogin(){
  const pw = document.getElementById("login-password").value;
  const err = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");
  err.style.display = "none";
  if(!pw){ err.textContent = "Skriv inn passordet."; err.style.display = "block"; return; }
  btn.disabled = true;
  document.getElementById("login-status").textContent = "Logger inn …";
  try{
    const { error } = await supabaseClient.auth.signInWithPassword({ email: AUTH_EMAIL, password: pw });
    if(error){
      err.textContent = "Feil passord, eller bruker ikke satt opp ennå.";
      err.style.display = "block";
      document.getElementById("login-status").textContent = "";
      btn.disabled = false;
      return;
    }
    document.getElementById("login-status").textContent = "Henter data …";
    await pullFromCloud();
    document.getElementById("login-password").value = "";
    showApp();
  }catch(e){
    console.error(e);
    err.textContent = "Kunne ikke koble til. Sjekk internettforbindelsen.";
    err.style.display = "block";
    document.getElementById("login-status").textContent = "";
  }
  btn.disabled = false;
}

document.getElementById("login-btn").onclick = doLogin;
document.getElementById("login-password").addEventListener("keydown", e=>{ if(e.key === "Enter") doLogin(); });
document.getElementById("logout-btn").onclick = async ()=>{
  if(!confirm("Logge ut?")) return;
  await supabaseClient.auth.signOut();
  showLogin("");
};
document.getElementById("modal-close").onclick = ()=> closeModal();
document.querySelectorAll("#tabbar button").forEach(b=>{ b.onclick = ()=> setTab(b.dataset.tab); });

/* Hent friske data når appen hentes fram igjen fra bakgrunnen */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && document.getElementById("app-root").classList.contains("on")){
    pullFromCloud().then(()=>{ render(); refreshBadge(); });
  }
});

(async function init(){
  loadLocal();
  showLogin("Sjekker innlogging …");
  try{
    const { data } = await supabaseClient.auth.getSession();
    if(data && data.session){
      document.getElementById("login-status").textContent = "Henter data …";
      await pullFromCloud();
      showApp();
    } else showLogin("");
  }catch(e){ showLogin(""); }
})();

/* Registrer service worker (gjør appen installerbar og raskere) */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(e=>console.log("SW ikke registrert:", e));
  });
}
